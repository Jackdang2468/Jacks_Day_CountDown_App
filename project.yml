# Xcode project definition. Generate the .xcodeproj with:  xcodegen generate
name: JacksDayCounter
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en
configFiles:
  Debug: Config/App.xcconfig
  Release: Config/App.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic
packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: "2.20.0"
targets:
  JacksDayCounter:
    type: application
    platform: iOS
    sources:
      - App
      - Shared
    dependencies:
      - package: Supabase
      - target: JacksDayCounterWidgets
    entitlements:
      path: App/JacksDayCounter.entitlements
      properties:
        com.apple.security.application-groups:
          - $(APP_GROUP_ID)
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Day Counter
        UILaunchScreen:
          UIColorName: ""
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        NSCalendarsWriteOnlyAccessUsageDescription: Day Counter adds your countdown events to the calendar you choose, such as Outlook.
        NSCalendarsFullAccessUsageDescription: Day Counter adds your countdowns to your Outlook calendar on this iPhone and keeps them up to date.
        NSCalendarsUsageDescription: Day Counter adds your countdown events to the calendar you choose, such as Outlook.
        NSFaceIDUsageDescription: Day Counter uses Face ID to unlock the app when you turn on app lock.
        NSSupportsLiveActivities: true
        NSPhotoLibraryUsageDescription: Choose a photo to show on your countdown and its widgets.
        AppGroupID: $(APP_GROUP_ID)
        SupabaseHost: $(SUPABASE_HOST)
        SupabaseAnonKey: $(SUPABASE_ANON_KEY)
        MicrosoftClientID: $(MS_CLIENT_ID)
        MicrosoftTenant: $(MS_TENANT)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).daycounter
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
  JacksDayCounterWidgets:
    type: app-extension
    platform: iOS
    sources:
      - Widgets
      - Shared
    entitlements:
      path: Widgets/JacksDayCounterWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - $(APP_GROUP_ID)
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: Day Counter Widgets
        AppGroupID: $(APP_GROUP_ID)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).daycounter.widgets
        SKIP_INSTALL: YES
schemes:
  JacksDayCounter:
    build:
      targets:
        JacksDayCounter: all
        JacksDayCounterWidgets: all
    run:
      config: Debug
    archive:
      config: Release
